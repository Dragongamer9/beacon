[workspace]
resolver = "2"
members = ["crates/beacon-core", "crates/beacon-cli", "src-tauri"]
default-members = ["crates/beacon-core", "crates/beacon-cli"]

[workspace.package]
version = "0.0.6"
edition = "2021"
authors = ["Dragongamer9"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
dirs = "5"
