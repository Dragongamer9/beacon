<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-accent="bfme1">
  <div class="backdrop" aria-hidden="true">
    <div class="glow"></div>
    <svg class="ridge" viewBox="0 0 1600 300" preserveAspectRatio="none">
      <path d="M0 300 L0 210 L120 170 L210 196 L330 120 L420 168 L520 92 L600 140 L700 110 L790 176 L900 84 L1010 150 L1120 118 L1230 180 L1340 132 L1460 190 L1600 150 L1600 300 Z"/>
      <path class="near" d="M0 300 L0 250 L160 228 L300 252 L470 214 L640 246 L820 222 L1000 254 L1180 226 L1380 250 L1600 232 L1600 300 Z"/>
    </svg>
  </div>

  <!-- Main layer: the game list on the left, the selected game on the right. -->
  <div class="layer" id="main-layer">
    <aside class="library" aria-label="Games">
      <header class="library-top">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#flame"/></svg>
          <span>Beacon</span>
        </div>
        <span class="clock" id="clock"></span>
      </header>
      <nav class="game-list" id="shelf" aria-label="Game list"></nav>
      <div class="library-actions">
        <button class="nav ghost" id="btn-scan"><svg viewBox="0 0 24 24"><use href="#i-scan"/></svg>Find games</button>
        <button class="nav ghost" id="btn-downloads"><svg viewBox="0 0 24 24"><use href="#i-download"/></svg>Downloads<span class="count" id="dl-count" hidden></span></button>
        <button class="nav ghost" id="btn-launcher-settings"><svg viewBox="0 0 24 24"><use href="#i-cog"/></svg>Launcher</button>
      </div>
    </aside>

    <main class="detail" id="hero">
      <div class="art" aria-hidden="true">
        <svg class="art-ridge" viewBox="0 0 1600 300" preserveAspectRatio="none">
          <path d="M0 300 L0 190 L140 150 L260 182 L380 104 L500 160 L620 86 L740 140 L860 98 L980 170 L1100 80 L1220 146 L1340 112 L1460 176 L1600 136 L1600 300 Z"/>
        </svg>
        <div class="hero-art" id="hero-art"></div>
        <svg class="art-emblem" viewBox="0 0 120 120"><use id="hero-emblem" href="#emblem-bfme1"/></svg>
        <img class="hero-icon" id="hero-icon" alt="" hidden>
      </div>
      <div class="detail-body">
        <p class="kicker" id="hero-kicker">The Lord of the Rings</p>
        <h1 id="hero-title">The Battle for Middle-earth</h1>
        <div class="chips" id="hero-chips"></div>
        <p class="issue" id="hero-issue" hidden></p>
        <div class="actions">
          <button class="nav play" id="btn-play"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg><span id="play-label">Play</span></button>
          <button class="nav secondary" id="btn-mods"><svg viewBox="0 0 24 24"><use href="#i-scroll"/></svg><span id="mods-label">Vanilla</span></button>
          <button class="nav secondary" id="btn-game-settings"><svg viewBox="0 0 24 24"><use href="#i-cog"/></svg>Game settings</button>
        </div>
        <div class="cards" id="hero-cards"></div>
      </div>
      <footer class="hints" id="hints"></footer>
    </main>
  </div>

  <!-- Sheets -->
  <aside class="layer sheet" id="sheet-mods" hidden>
    <header><p class="kicker" data-game-short></p><h2>Mods</h2></header>
    <div class="rows" id="mods-rows"></div>
    <div class="sheet-foot">
      <button class="nav row-btn" id="btn-catalog"><svg viewBox="0 0 24 24"><use href="#i-scroll"/></svg>Browse known mods &amp; patches</button>
      <button class="nav row-btn" id="btn-workshop"><svg viewBox="0 0 24 24"><use href="#i-download"/></svg>Workshop: fan mods, maps &amp; patches</button>
      <button class="nav row-btn" id="btn-find-mods"><svg viewBox="0 0 24 24"><use href="#i-scan"/></svg>Find mods on this PC</button>
      <button class="nav row-btn" id="btn-add-mod-file"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add mod file (.big or launcher)</button>
      <button class="nav row-btn" id="btn-add-mod-folder"><svg viewBox="0 0 24 24"><use href="#i-folder"/></svg>Add mod folder</button>
      <button class="nav row-btn" id="btn-open-mods"><svg viewBox="0 0 24 24"><use href="#i-open"/></svg>Open mods folder</button>
    </div>
  </aside>

  <aside class="layer sheet" id="sheet-downloads" hidden>
    <header><p class="kicker">Beacon</p><h2>Downloads</h2></header>
    <div class="rows" id="downloads-rows"></div>
    <div class="sheet-foot" id="downloads-foot"></div>
  </aside>

  <aside class="layer sheet" id="sheet-catalog" hidden>
    <header><p class="kicker" data-game-short></p><h2>Mod catalog</h2></header>
    <div class="rows" id="catalog-rows"></div>
    <div class="sheet-foot">
      <button class="nav row-btn" id="btn-catalog-add"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add a downloaded mod</button>
      <button class="nav row-btn" id="btn-catalog-find"><svg viewBox="0 0 24 24"><use href="#i-scan"/></svg>Find mods on this PC</button>
    </div>
  </aside>

  <aside class="layer sheet" id="sheet-workshop" hidden>
    <header><p class="kicker" data-game-short></p><h2>Workshop</h2></header>
    <div class="rows" id="workshop-rows"></div>
    <div class="sheet-foot">
      <button class="nav row-btn" id="btn-workshop-more"><svg viewBox="0 0 24 24"><use href="#i-scan"/></svg>Next page</button>
      <button class="nav row-btn" id="btn-workshop-site"><svg viewBox="0 0 24 24"><use href="#i-open"/></svg>Open bfmeladder.com</button>
    </div>
  </aside>

  <aside class="layer sheet" id="sheet-game" hidden>
    <header><p class="kicker">Game settings</p><h2 data-game-title></h2></header>
    <div class="rows" id="game-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-uninstall" hidden>
    <header><p class="kicker" data-game-short></p><h2>Uninstall</h2></header>
    <div class="rows" id="uninstall-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-add" hidden>
    <header><p class="kicker">Other Games</p><h2>Add a game</h2></header>
    <div class="rows" id="add-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-custom" hidden>
    <header><p class="kicker">Game settings</p><h2 data-custom-title></h2></header>
    <div class="rows" id="custom-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-wine" hidden>
    <header><p class="kicker" data-custom-title></p><h2>Wine tools</h2></header>
    <div class="rows" id="wine-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-pick" hidden>
    <header><p class="kicker" data-custom-title></p><h2>Choose the game's program</h2></header>
    <div class="rows" id="pick-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-tools" hidden>
    <header><p class="kicker">Beacon</p><h2>Compatibility tools</h2></header>
    <div class="rows" id="tools-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-tool" hidden>
    <header><p class="kicker" id="tool-target"></p><h2 id="tool-name"></h2></header>
    <div class="rows" id="tool-rows"></div>
  </aside>

  <aside class="layer sheet" id="sheet-launcher" hidden>
    <header><p class="kicker">Beacon</p><h2>Launcher settings</h2></header>
    <div class="rows" id="launcher-rows"></div>
  </aside>

  <!-- Launch overlay -->
  <div class="layer overlay" id="overlay" hidden>
    <div class="overlay-card">
      <svg class="overlay-flame" viewBox="0 0 32 32" aria-hidden="true"><use href="#flame"/></svg>
      <h2 id="overlay-title">Lighting the beacon…</h2>
      <p id="overlay-text"></p>
      <button class="nav play" id="overlay-ok" hidden>OK</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#c8641c"/><stop offset=".55" stop-color="#e8a33d"/><stop offset="1" stop-color="#ffe2a0"/>
      </linearGradient>
    </defs>
    <symbol id="flame" viewBox="0 0 32 32">
      <path fill="url(#flame-grad)" d="M16 2c1.6 4.6 6.9 7.6 6.9 14.1A6.9 6.9 0 0 1 16 23a6.9 6.9 0 0 1-6.9-6.9c0-3.2 1.6-5.2 3.1-6.8.3 2 1.2 3.4 2.6 4.2C14 9.6 14.6 5.6 16 2z"/>
      <path fill="currentColor" opacity=".9" d="M6 25h20l-2 2.5H8zM9 28.5h14l-1.2 1.5H10.2z"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7.4 7.4 0 0 1-2 1.2l-.3 2h-3.6l-.3-2a7.4 7.4 0 0 1-2-1.2l-1.9.7-1.8-3.1 1.6-1.2a7.6 7.6 0 0 1 0-2.4L3.4 9.7l1.8-3.1 1.9.7a7.4 7.4 0 0 1 2-1.2l.3-2h3.6l.3 2a7.4 7.4 0 0 1 2 1.2l1.9-.7 1.8 3.1-1.6 1.2a7.6 7.6 0 0 1 0 2.4z"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7 4h11a2 2 0 0 1 2 2v1h-4M7 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7M7 4a2 2 0 0 1 2 2v12M11 9h4M11 13h4"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5 20 20"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3.5 7a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-8.5 8.5M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>

    <symbol id="i-wine" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 3h8l-.6 5.2A3.4 3.4 0 0 1 12 11.2a3.4 3.4 0 0 1-3.4-3L8 3zM12 11.2V20M8.5 20.5h7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>

    <!-- Original emblems for the game tiles -->
    <symbol id="emblem-custom" viewBox="0 0 120 120">
      <rect x="22" y="34" width="76" height="52" rx="16" fill="none" stroke="currentColor" stroke-width="3"/>
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M42 52v14M35 59h14"/>
      <circle cx="76" cy="54" r="4" fill="currentColor"/><circle cx="84" cy="64" r="4" fill="currentColor" opacity=".6"/>
    </symbol>
    <symbol id="emblem-add" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="38" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 7"/>
      <path fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" d="M60 44v32M44 60h32"/>
    </symbol>
    <symbol id="emblem-bfme1" viewBox="0 0 120 120">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" d="M10 104 44 54l14 16 18-30 34 64z"/>
      <path fill="none" stroke="currentColor" stroke-width="2" opacity=".5" d="M38 104l20-26 10 10 10-14 20 30"/>
      <path fill="currentColor" d="M76 40c-5-6-1-14 2-18 0 5 4 6 5 3 3 4 3 11-1 15z" opacity=".95"/>
      <path fill="none" stroke="currentColor" stroke-width="2.5" d="M70 40h14"/>
    </symbol>
    <symbol id="emblem-bfme2" viewBox="0 0 120 120">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" d="M14 80 40 36l14 18 14-26 38 52z"/>
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M10 92c8-5 16-5 24 0s16 5 24 0 16-5 24 0 16 5 24 0 8-4 4-2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55" d="M18 104c7-4 14-4 21 0s14 4 21 0 14-4 21 0 14 4 21 0"/>
    </symbol>
    <symbol id="emblem-aotr" viewBox="0 0 120 120">
      <ellipse cx="60" cy="70" rx="38" ry="14" fill="none" stroke="currentColor" stroke-width="7"/>
      <ellipse cx="60" cy="70" rx="38" ry="14" fill="none" stroke="var(--bg, #0f0d0b)" stroke-width="1.5" opacity=".6"/>
      <path fill="currentColor" d="M60 18c-6 7-1 15 2 19 0-5 4-6 5-3 3 4 3 11-1 15-7 3-15-1-15-9 0-5 3-9 9-22z" opacity=".95"/>
      <path fill="none" stroke="currentColor" stroke-width="2" opacity=".5" d="M24 98h72"/>
    </symbol>
    <symbol id="emblem-conquest" viewBox="0 0 120 120">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" d="M60 16 92 28v26c0 22-14 38-32 48-18-10-32-26-32-48V28z"/>
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M44 44l32 32M76 44 44 76"/>
      <path fill="currentColor" d="M41 41h8l-8 8zM79 41h-8l8 8z" opacity=".8"/>
    </symbol>
    <symbol id="emblem-uaw" viewBox="0 0 120 120">
      <circle cx="60" cy="62" r="26" fill="none" stroke="currentColor" stroke-width="3"/>
      <ellipse cx="60" cy="62" rx="48" ry="14" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(-18 60 62)"/>
      <path fill="none" stroke="currentColor" stroke-width="2" opacity=".55" d="M40 50c10 6 30 6 40 0M38 70c12 6 32 6 44 0"/>
      <circle cx="98" cy="40" r="4" fill="currentColor"/>
    </symbol>
    <symbol id="emblem-exigo" viewBox="0 0 120 120">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" d="M38 102V44h-6V26h10v8h8v-8h20v8h8v-8h10v18h-6v58z"/>
      <path fill="none" stroke="currentColor" stroke-width="3" d="M52 102V82a8 8 0 0 1 16 0v20"/>
      <path fill="currentColor" d="M60 52l5 8-5 8-5-8z"/>
      <path fill="none" stroke="currentColor" stroke-width="2" opacity=".5" d="M24 102h72"/>
    </symbol>
    <symbol id="emblem-rol" viewBox="0 0 120 120">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" d="M60 22l6 10 11-4 1 12 12 1-4 11 10 6-10 6 4 11-12 1-1 12-11-4-6 10-6-10-11 4-1-12-12-1 4-11-10-6 10-6-4-11 12-1 1-12 11 4z"/>
      <circle cx="60" cy="60" r="14" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="60" cy="60" r="5" fill="currentColor"/>
    </symbol>
    <symbol id="emblem-swgb" viewBox="0 0 120 120">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M60 60c0-10 14-12 18-2 5 13-10 26-24 22-18-5-20-30-6-40 18-13 46-2 48 22"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55" d="M60 60c0 10-14 12-18 2-5-13 10-26 24-22 18 5 20 30 6 40-18 13-46 2-48-22"/>
      <circle cx="26" cy="28" r="2.5" fill="currentColor"/><circle cx="96" cy="94" r="2.5" fill="currentColor"/><circle cx="100" cy="30" r="1.8" fill="currentColor"/>
    </symbol>
    <symbol id="emblem-rotwk" viewBox="0 0 120 120">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" d="M22 92 30 46l12 22 8-40 10 34 10-34 8 40 12-22 8 46z"/>
      <path fill="none" stroke="currentColor" stroke-width="3" d="M20 100h80"/>
      <path fill="currentColor" d="M60 74l5 8-5 8-5-8z"/>
    </symbol>
  </svg>

  <script type="module" src="app.js"></script>
</body>
</html>
